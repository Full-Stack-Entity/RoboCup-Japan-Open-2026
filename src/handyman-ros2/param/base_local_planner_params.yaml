# base_local_planner_params.yaml — ROS2 Humble
# Kept as standalone reference (original TrajectoryPlanner config).
# In ROS2 the DWB planner is used instead; see nav2_params.yaml.

TrajectoryPlannerROS:
  max_vel_x:  0.5
  min_vel_x: -0.1
  max_vel_theta:  1.0
  min_vel_theta: -1.0
  min_in_place_vel_theta: 0.1
  acc_lim_x:     2.5
  acc_lim_y:     2.5
  acc_lim_theta: 3.2
  xy_goal_tolerance:  0.10
  yaw_goal_tolerance: 0.05
  holonomic_robot: false
