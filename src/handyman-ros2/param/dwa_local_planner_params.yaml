# dwa_local_planner_params.yaml — ROS2 Humble
# Kept as standalone reference; primary config is nav2_params.yaml (FollowPath/DWB)

DWAPlannerROS:
  max_vel_x:  0.2
  min_vel_x: -0.2
  max_vel_trans:  0.2
  min_vel_trans: -0.2
  max_vel_theta:  0.2
  min_vel_theta:  0.05
  acc_lim_x:     0.8
  acc_lim_theta: 0.5
  acc_lim_y:     1.0
  yaw_goal_tolerance:  0.05
  xy_goal_tolerance:   0.1
  sim_time:        3.5
  vx_samples:      30
  vy_samples:       0
  vtheta_samples:  40
  path_distance_bias:    40.0
  goal_distance_bias:    30.0
  occdist_scale:          0.05
  forward_point_distance: 0.3
  stop_time_buffer:       0.5
  scaling_speed:          0.3
  max_scaling_factor:     0.2
  oscillation_reset_dist: 0.05
  publish_traj_pc:        true
  publish_cost_grid_pc:   true
  global_frame_id:        map
