# global_costmap_params.yaml — ROS2 Humble
# Kept as standalone reference; primary config is nav2_params.yaml

global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 2.0
  publish_frequency: 1.0
  rolling_window: false
  transform_tolerance: 10
  always_send_full_costmap: true
  static_layer:
    static_map: true
