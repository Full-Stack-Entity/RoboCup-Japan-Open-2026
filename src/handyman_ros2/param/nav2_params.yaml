# Nav2 unified parameter file — ROS 2 Humble
# Replaces: costmap_common_params_hsr.yaml, local_costmap_params.yaml,
#           global_costmap_params.yaml, move_base_params.yaml,
#           dwa_local_planner_params.yaml

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.05

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      # Robot velocity limits (from original dwa_local_planner_params.yaml)
      min_vel_x: -0.2
      max_vel_x:  0.2
      max_vel_y:  0.0
      min_vel_y:  0.0
      max_vel_theta:  0.2
      min_vel_theta:  0.05
      max_speed_xy:   0.2
      min_speed_xy:  -0.2
      max_speed_theta: 0.2
      min_speed_theta: 0.05
      # Acceleration limits
      acc_lim_x:     0.8
      acc_lim_y:     1.0
      acc_lim_theta: 0.5
      decel_lim_x:  -0.8
      decel_lim_y:  -1.0
      decel_lim_theta: -0.5
      # Sim parameters
      sim_time: 3.5
      vx_samples: 30
      vy_samples: 0
      vtheta_samples: 40
      sim_granularity: 0.025
      # Scoring
      path_distance_bias:    40.0
      goal_distance_bias:    30.0
      occdist_scale:          0.05
      forward_point_distance: 0.3
      stop_time_buffer:       0.5
      scaling_speed:          0.3
      max_scaling_factor:     0.2
      oscillation_reset_dist: 0.05
      publish_traj_pc:        true
      publish_cost_grid_pc:   true
      global_frame_id:        map
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle",
                "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: false
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    default_nav_to_pose_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "back_up", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    back_up:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame:  odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width:  3.5
      height: 3.5
      resolution: 0.05
      transform_tolerance: 10.0
      # Robot footprint (from original costmap_common_params_hsr.yaml)
      footprint: "[[-0.205, -0.145], [-0.205, 0.145], [0.077, 0.145], [0.077, -0.145]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: base_scan
        base_scan:
          data_type: LaserScan
          topic: /hsrb/base_scan
          marking: true
          clearing: true
          observation_persistence: 0.0
          max_obstacle_height: 2.0
          obstacle_range:  2.5
          raytrace_range:  3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: false
      transform_tolerance: 10.0
      footprint: "[[-0.205, -0.145], [-0.205, 0.145], [0.077, 0.145], [0.077, -0.145]]"
      footprint_padding: 0.01
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: base_scan
        base_scan:
          data_type: LaserScan
          topic: /hsrb/base_scan
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_range: 2.5
          raytrace_range: 3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0
        inflation_radius: 0.45
      always_send_full_costmap: true
