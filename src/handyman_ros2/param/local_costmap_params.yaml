# local_costmap_params.yaml — ROS2 Humble
# Kept as standalone reference; primary config is nav2_params.yaml

local_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 2.0
  publish_frequency: 1.0
  rolling_window: true
  width: 3.5
  height: 3.5
  resolution: 0.05
  transform_tolerance: 10.0
  static_layer:
    static_map: false
