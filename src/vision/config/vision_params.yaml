# Vision Package Configuration

object_detection:
  ros__parameters:
    model_path: "models/yolo12n.pt"
    confidence_threshold: 0.5
    hand_confidence_threshold: 0.1
    
    # Camera topics
    head_cam_topic: "/hsrb/head_rgbd_sensor/rgb/image_raw"
    hand_cam_topic: "/hsrb/hand_camera/image_raw"
    depth_cam_topic: "/hsrb/head_rgbd_sensor/depth_registered/image_raw"
    
    # Detection parameters
    max_detections: 1
    use_gpu: true
    
    # Class names (30 classes)
    class_names:
      - "apple"
      - "bear_doll"
      - "canned_juice"
      - "cigarette"
      - "clock"
      - "dog_doll"
      - "empty_ketchup"
      - "empty_plastic_bottle"
      - "filled_ketchup"
      - "filled_plastic_bottle"
      - "game_controller"
      - "ground_pepper"
      - "hourglass"
      - "matryoshka"
      - "nursing_bottle"
      - "piggy_bank"
      - "pink_cup"
      - "rabbit_doll"
      - "rubik-s_cube"
      - "salt"
      - "sauce"
      - "soysauce"
      - "spray_bottle"
      - "sugar"
      - "toy_car"
      - "toy_duck"
      - "toy_penguin"
      - "tumbler"
      - "white_cup"
      - "white_side_table"
